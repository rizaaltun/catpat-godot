name: Godot verification
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Web build to GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import assets and parse project
        run: python3 tools/run_godot_check.py --headless --path . --editor --import --quit

      - name: Run save regression check
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/save_test.gd

      - name: Run touch pointer ownership regression check
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/input_router_test.gd

      - name: Verify local profile isolation, observations, and chapter restart
        run: |
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/profile_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/observation_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/chapter_support_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/chapter_support_ui_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/parent_panel_test.gd

      - name: Run dialogue regression check
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/dialogue_test.gd

      - name: Run comic regression check
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/comic_test.gd

      - name: Run menu, font, and recovery regression check
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/startup_regression.gd

      - name: Check engine error gate
        run: python3 tests/test_godot_check.py

      - name: Run audio and preference contracts
        run: |
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/audio_service_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/preferences_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/experience_test.gd

      - name: Render settings, completed chapter selector, and scaled HUD
        run: |
          timeout -k 10s 120s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://tests/settings_panel_test.gd -- --settings-capture
          timeout -k 10s 120s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://tests/replay_test.gd -- --replay-capture
          timeout -k 10s 120s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://tests/experience_hud_test.gd -- --experience-capture

      - name: Run B00 tutorial, migration, and rendered viewport contract
        run: timeout -k 10s 180s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://tests/home_contract.gd -- --home-capture

      - name: Render legacy chapter framing and real jump bounds
        run: timeout -k 10s 240s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://tests/legacy_framing_test.gd -- --legacy-framing-capture

      - name: Run B01 full gameplay regression and capture rendered states
        run: timeout -k 10s 240s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility res://scenes/polish_v3.tscn -- --v9-capture

      - name: Run B02 full gameplay regression and capture rendered states
        run: timeout -k 10s 240s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility res://scenes/river.tscn -- --v10-test --v10-capture

      - name: Run B03 full gameplay regression
        run: timeout -k 10s 180s python3 tools/run_godot_check.py --headless --path . res://scenes/garden.tscn -- --v13-test

      - name: Render B03 active tasks and companion gathering
        run: timeout -k 10s 120s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://preproduction/qa/v23/garden_capture.gd

      - name: Run B04 transition regression checks
        run: |
          timeout -k 10s 240s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://preproduction/qa/v21/root_transition.gd -- --v21-capture
          timeout -k 10s 240s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://preproduction/qa/v21/root_main_quest.gd -- --v21-capture

      - name: Capture B05 rendered viewport for visual review
        run: timeout -k 10s 120s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://preproduction/qa/v22/festival_capture.gd

      - name: Verify image-backed chapter art projections
        run: |
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/summit_art_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/image_effects_test.gd

      - name: Run B05 shared movement, image state and read-only finale checks
        run: |
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/festival_movement_test.gd
          timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/festival_art_test.gd

      - name: Render B05 actor framing across text and control profiles
        run: timeout -k 10s 180s xvfb-run -a python3 tools/run_godot_check.py --path . --rendering-method gl_compatibility --script res://tests/festival_framing_test.gd -- --framing-capture

      - name: Run B05 save and scene contract
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/festival_contract.gd

      - name: Run B05 rejected-load menu recovery
        run: timeout -k 10s 120s python3 tools/run_godot_check.py --headless --path . --script res://tests/festival_recovery_test.gd

      - name: Export browser build
        run: |
          mkdir -p build/web
          build_name="catpat-${GITHUB_SHA}"
          python3 tools/run_godot_check.py --headless --path . --export-debug "Web Preview" "build/web/${build_name}.html"
          python3 tools/prepare_web_export.py --source "build/web/${build_name}.html" --output build/web/index.html
          python3 tests/web_export_test.py --html build/web/index.html
          node tests/web_shell_test.cjs build/web/index.html

      - name: Configure GitHub Pages for a confirmed publish
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/work/t22-source-migration') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/work/t22-source-migration') }}
        uses: actions/configure-pages@v5

      - name: Upload verified browser build to Pages
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/work/t22-source-migration') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/work/t22-source-migration') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/work/t22-source-migration') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/work/t22-source-migration') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
