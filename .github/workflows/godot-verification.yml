name: Godot verification
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Web build to GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import assets and parse project
        run: godot --headless --path . --editor --import --quit

      - name: Run save regression check
        run: timeout -k 10s 120s godot --headless --path . --script res://tests/save_test.gd

      - name: Run dialogue regression check
        run: timeout -k 10s 120s godot --headless --path . --script res://tests/dialogue_test.gd

      - name: Run comic regression check
        run: timeout -k 10s 120s godot --headless --path . --script res://tests/comic_test.gd

      - name: Run menu, font, and recovery regression check
        run: timeout -k 10s 120s godot --headless --path . --script res://tests/startup_regression.gd

      - name: Run B01 full gameplay regression and capture rendered states
        run: timeout -k 10s 240s xvfb-run -a godot --path . --rendering-method gl_compatibility res://scenes/polish_v3.tscn -- --v9-capture

      - name: Run B02 full gameplay regression and capture rendered states
        run: timeout -k 10s 240s xvfb-run -a godot --path . --rendering-method gl_compatibility res://scenes/river.tscn -- --v10-test --v10-capture

      - name: Run B03 full gameplay regression
        run: timeout -k 10s 180s godot --headless --path . res://scenes/garden.tscn -- --v13-test

      - name: Run B04 transition regression checks
        run: |
          timeout -k 10s 240s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://preproduction/qa/v21/root_transition.gd -- --v21-capture
          timeout -k 10s 240s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://preproduction/qa/v21/root_main_quest.gd -- --v21-capture

      - name: Capture B05 rendered viewport for visual review
        run: timeout -k 10s 120s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://preproduction/qa/v22/festival_capture.gd

      - name: Run B05 save and scene contract
        run: timeout -k 10s 120s godot --headless --path . --script res://tests/festival_contract.gd

      - name: Export browser build
        run: |
          mkdir -p build/web
          build_name="catpat-${GITHUB_SHA}"
          godot --headless --path . --export-debug "Web Preview" "build/web/${build_name}.html"
          cp "build/web/${build_name}.html" build/web/index.html
          python3 -c 'from pathlib import Path; p=Path("build/web/index.html"); s=p.read_text(); assert "<head>" in s; s=s.replace("<head>", "<head>\\n<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\\n<meta http-equiv=\"Expires\" content=\"0\">", 1); p.write_text(s)'
          grep -q "${build_name}" build/web/index.html
          test -s "build/web/${build_name}.js"
          test -s "build/web/${build_name}.wasm"
          test -s "build/web/${build_name}.pck"
          test -s build/web/index.html

      - name: Configure GitHub Pages for a confirmed publish
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/work/t22-source-migration') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/work/t22-source-migration') }}
        uses: actions/configure-pages@v5

      - name: Upload verified browser build to Pages
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/work/t22-source-migration') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/work/t22-source-migration') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/work/t22-source-migration') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/work/t22-source-migration') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
