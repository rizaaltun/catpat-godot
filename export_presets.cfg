[preset.0]
name="macOS Test"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/animation/regions.json,preproduction/story/*.json"
exclude_filter="production/*,preproduction/qa/*,docs/*,tools/*,assets/source/*,preproduction/references/*,preproduction/review-v2/*,preproduction/polish-v3/*"
export_path="../Catpat-iMac-Test.zip"
script_export_mode=2

[preset.0.options]
export/architecture="universal"
application/bundle_identifier="local.catpat.festival.test"
application/short_version="0.2.0"
application/version="2"
application/min_macos_version="10.13"
codesign/codesign=1
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=false
codesign/entitlements/debugging=false
notarization/notarization=0

[preset.1]
name="Web Preview"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/animation/regions.json,preproduction/story/*.json"
exclude_filter="production/*,preproduction/qa/*,docs/*,tools/*,assets/source/*,preproduction/references/*,preproduction/review-v2/*,preproduction/polish-v3/*"
export_path="../catpat-web/dist/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
